name: Windows CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest

    env:
      LTS_VERSION: ${{ vars.LTS_VERSION }}
      VALTC_BIN: C:\valtc_install\bin\valtc.exe
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Get ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Install dependencies
        run: |
          $ErrorActionPreference = "Stop"
          choco install ccache -y
          vcpkg install fmt:x64-windows nlohmann-json:x64-windows

      - name: Compile code
        run: |
          $ErrorActionPreference = "Stop"
          cd Code
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT="Embedded"
          cmake --build build --config Release -j -- /nologo /verbosity:minimal | Select-String -NotMatch "C:\\Program Files\\Microsoft Visual Studio" | Select-String -NotMatch "^\s*(\[|\]|with|_Kty=|_Ty=|_Myself=)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cmake install
        run: |
          $ErrorActionPreference = "Stop"
          cd Code
          cmake --install build --config Release --prefix C:\valtc_install
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" -Destination "C:\valtc_install\bin\" -Force
          "C:\valtc_install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CTests
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S Code/TESTS -B build/tests -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/tests --config Release
          ctest --test-dir build/tests -C Release --output-on-failure