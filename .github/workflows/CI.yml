name: CI

on:
  push:
  pull_request:

jobs:
  # Build and test with linux
  Linux-build-and-test:
    runs-on: ubuntu-latest

    env:
      LTS_VERSION: ${{ vars.LTS_VERSION }}
      VALTC_BIN: ${{ vars.VALTC_BIN }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      # Get repository
      - name: Get repository
        uses: actions/checkout@v4

      # Get ccache
      - name: Get ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-

      # Install libraries & ccache
      - name: Install needed libraries
        run: sudo apt-get update && sudo apt-get install -y ccache

      # Run building by cmake
      - name: Build Binary app by cmake
        run: |
          ccache -z
          cmake -S Code -B build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/release -j
          ccache -s
          cmake --install build/release --prefix "$RUNNER_TEMP/valtcommand-install"

      # build ctests and test
      - name: CTests
        run: |
          cmake -S Code/TESTS -B build/tests -DCMAKE_BUILD_TYPE=Release -DVALTC_TESTS_USE_PACKAGE=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/valtcommand-install" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/tests -j
          ctest --test-dir build/tests --output-on-failure

      - name: Build and test installed-package examples
        run: |
          cmake -S DOCs/V1.0.0/Embedding-Guide/examples -B build/embedding-examples -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/valtcommand-install"
          cmake --build build/embedding-examples -j
          LD_LIBRARY_PATH="$RUNNER_TEMP/valtcommand-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ctest --test-dir build/embedding-examples --output-on-failure

      # A small test before start
      - name: Last test
        run: |
          "$RUNNER_TEMP/valtcommand-install/bin/${VALTC_BIN}" --eval "CALL println value<str>:'Hellow world!' END"

  # Build and test by windows
  Windows-build-and-test:
    runs-on: windows-latest

    env:
      LTS_VERSION: ${{ vars.LTS_VERSION }}
      VALTC_BIN: ${{ vars.VALTC_BIN }}.exe
      CCACHE_DIR: ${{ github.workspace }}\.ccache

    steps:
      - name: Get repository
        uses: actions/checkout@v4
 
      - name: Get ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Install dependencies & ccache
        run: |
          $ErrorActionPreference = "Stop"
          choco install ccache -y --no-progress
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile code
        run: |
          $ErrorActionPreference = "Stop"
          ccache -z

          cmake -S Code -B build/release -G Ninja --fresh `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT="Embedded"

          cmake --build build/release -j
          ccache -s

      - name: Cmake install
        run: |
          $ErrorActionPreference = "Stop"
          $InstallPrefix = Join-Path $env:RUNNER_TEMP "valtcommand-install"
          cmake --install build/release --prefix $InstallPrefix
          (Join-Path $InstallPrefix "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CTests
        run: |
          $ErrorActionPreference = "Stop"
          $InstallPrefix = Join-Path $env:RUNNER_TEMP "valtcommand-install"

          cmake -S Code/TESTS -B build/tests -G Ninja --fresh `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DVALTC_TESTS_USE_PACKAGE=ON `
            -DCMAKE_PREFIX_PATH=$InstallPrefix

          cmake --build build/tests -j
          ctest --test-dir build/tests --output-on-failure

          cmake -S DOCs/V1.0.0/Embedding-Guide/examples -B build/embedding-examples -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH=$InstallPrefix
          cmake --build build/embedding-examples -j
          ctest --test-dir build/embedding-examples --output-on-failure

      # A small test before start
      - name: Last test
        run: |
          $BinPath = Join-Path $env:RUNNER_TEMP "valtcommand-install\bin\$env:VALTC_BIN"
          & $BinPath --eval "CALL println value<str>:'Hellow world!' END"

  # Build and test with MacOS
  MacOS-build-and-test:
    runs-on: macos-latest

    env:
      LTS_VERSION: ${{ vars.LTS_VERSION }}
      VALTC_BIN: ${{ vars.VALTC_BIN }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"

    steps:
      # Get repository
      - name: Get repository
        uses: actions/checkout@v4

      # Get ccache
      - name: Get ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-

      # Install libraries & ccache
      - name: Install needed libraries
        run: brew install ccache

      # Run building by cmake
      - name: Build Binary app by cmake
        run: |
          ccache -z
          cmake -S Code -B build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix) -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/release -j$(sysctl -n hw.ncpu)
          ccache -s
          cmake --install build/release --prefix "$RUNNER_TEMP/valtcommand-install"
          echo "$RUNNER_TEMP/valtcommand-install/bin" >> $GITHUB_PATH

      # build ctests and test
      - name: CTests
        run: |
          cmake -S Code/TESTS -B build/tests -DCMAKE_BUILD_TYPE=Release -DVALTC_TESTS_USE_PACKAGE=ON -DCMAKE_PREFIX_PATH="$(brew --prefix);$RUNNER_TEMP/valtcommand-install" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/tests -j$(sysctl -n hw.ncpu)
          ctest --test-dir build/tests --output-on-failure

          cmake -S DOCs/V1.0.0/Embedding-Guide/examples -B build/embedding-examples -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/valtcommand-install"
          cmake --build build/embedding-examples -j$(sysctl -n hw.ncpu)
          DYLD_LIBRARY_PATH="$RUNNER_TEMP/valtcommand-install/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" ctest --test-dir build/embedding-examples --output-on-failure

      # A small test before start
      - name: Last test
        run: |
          "$RUNNER_TEMP/valtcommand-install/bin/${VALTC_BIN}" --eval "CALL println value<str>:'Hellow world!' END"