name: CI

env:
  LTS_VERSION: ${{ vars.LTS_VERSION }}
  VALTC_BIN: ${{ vars.VALTC_BIN }}

on:
  push:
  pull_request:

jobs:
  test-and-build-by-linux:
    runs-on: ubuntu-latest
    
    steps:
    
      # Get repository
      - name: get repository
        uses: actions/checkout@v4
      
      # Get ccache (cmake cache) files
      - name: Get ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-
        
      # Install libraries
      - name: Install needed libraries
        run: sudo apt-get update && sudo apt-get install -y libfmt-dev nlohmann-json3-dev ccache

      # build ctests and test
      - name: CTests
        run: |
          cmake -S Code/TESTS -B build/tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/tests
          ctests --test-dir build/tests --output-on-failure
      
      # Run building by cmake
      - name: Build Binary app by cmake
        run: |
          cd Code
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j
          sudo cmake --install build
          sudo ldconfig

      # A small test befor start
      - name: Last test
        run: |
          ${VALTC_BIN} --eval "CALL println value<str>:'Hellow world!' END"
      
