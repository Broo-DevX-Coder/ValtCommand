name: CI

on:
  push:
  pull_request:

jobs:
  # Build and test with linux
  Linux-build-and-test:
    runs-on: ubuntu-latest

    env:
      LTS_VERSION: ${{ vars.LTS_VERSION }}
      VALTC_BIN: ${{ vars.VALTC_BIN }}
    
    steps:
    
      # Get repository
      - name: get repository
        uses: actions/checkout@v4
      
      # Get cache
      - name: Get cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-build-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-cmake-build-
        
      # Install libraries
      - name: Install needed libraries
        run: sudo apt-get update && sudo apt-get install -y libfmt-dev nlohmann-json3-dev

      # Run building by cmake
      - name: Build Binary app by cmake
        run: |
          cmake -S Code -B build/release -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release -j
          sudo cmake --install build/release
          sudo ldconfig

      # build ctests and test
      - name: CTests
        run: |
          cmake -S Code/TESTS -B build/tests -DCMAKE_BUILD_TYPE=Release -DVALTC_TESTS_USE_PACKAGE=ON
          cmake --build build/tests -j
          ctest --test-dir build/tests --output-on-failure

      # A small test befor start
      - name: Last test
        run: |
          ${VALTC_BIN} --eval "CALL println value<str>:'Hellow world!' END"
      
  # Build and test by windows
  Windows-build-and-test:
    runs-on: windows-latest

    env:
      LTS_VERSION: ${{ vars.LTS_VERSION }}
      VALTC_BIN: C:\valtc_install\bin\${{ vars.VALTC_BIN }}.exe
      CONAN_HOME: ${{ github.workspace }}\.conan2

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Get cmake cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-build-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-cmake-build-

      - name: Get conan cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.conan2
          key: ${{ runner.os }}-conan-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-conan-

      - name: Install dependencies
        run: |
          $ErrorActionPreference = "Stop"
          pip install conan
          conan profile detect --force
          conan install `
            --requires="fmt/11.1.4" `
            --requires="nlohmann_json/3.10.5" `
            --output-folder="conan_dps" `
            --build=missing `
            -s build_type=Release `
            -g CMakeDeps `
            -g CMakeToolchain

      - name: Compile code
        run: |
          $ErrorActionPreference = "Stop"
          $ToolchainFile = (Get-ChildItem -Path "conan_dps" -Filter "conan_toolchain.cmake" -Recurse | Select-Object -First 1).FullName
          if (-not $ToolchainFile) { throw "conan_toolchain.cmake not found!" }
          Write-Host "Using Toolchain: $ToolchainFile"
          
          cmake -S Code -B build/release --fresh -DCMAKE_TOOLCHAIN_FILE="$ToolchainFile" -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT="Embedded"
          cmake --build build/release --config Release -j -- /nologo /verbosity:minimal | ForEach-Object {
            if ($_ -notmatch "C:\\Program Files\\Microsoft Visual Studio" -and $_ -notmatch "^\s*(\[|\]|with|_Kty=|_Ty=|_Myself=)") {
              $_
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: CTests
        run: |
          $ErrorActionPreference = "Stop"
          $ToolchainFile = (Get-ChildItem -Path "conan_dps" -Filter "conan_toolchain.cmake" -Recurse | Select-Object -First 1).FullName
          
          cmake -S Code/TESTS -B build/tests --fresh -DCMAKE_TOOLCHAIN_FILE="$ToolchainFile" -DVALTC_TESTS_USE_PACKAGE=ON -DCMAKE_PREFIX_PATH="C:\valtc_install"
          cmake --build build/tests -j --config Release
          ctest --test-dir build/tests -C Release --output-on-failure
          "C:\valtc_install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CTests
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S Code/TESTS -B build/tests -DCMAKE_TOOLCHAIN_FILE="conan_dps/conan_toolchain.cmake" -DVALTC_TESTS_USE_PACKAGE=ON -DCMAKE_PREFIX_PATH=C:\valtc_install
          cmake --build build/tests -j --config Release
          ctest --test-dir build/tests -C Release --output-on-failure

      # A small test befor start
      - name: Last test
        run: |
          & $env:VALTC_BIN --eval "CALL println value<str>:'Hellow world!' END"

  # Build and test with MacOS
  MacOS-build-and-test:
    runs-on: macos-latest

    env:
      LTS_VERSION: ${{ vars.LTS_VERSION }}
      VALTC_BIN: ${{ vars.VALTC_BIN }}
    
    steps:
    
      # Get repository
      - name: get repository
        uses: actions/checkout@v4
      
      # Get cache
      - name: Get cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-build-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-cmake-build-
        
      # Install libraries
      - name: Install needed libraries
        run: brew install fmt nlohmann-json

      # Run building by cmake
      - name: Build Binary app by cmake
        run: |
          cmake -S Code -B build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix)
          cmake --build build/release -j$(sysctl -n hw.ncpu)
          sudo cmake --install build/release --prefix /opt/valtc
          echo "/opt/valtc/bin" >> $GITHUB_PATH

      # build ctests and test
      - name: CTests
        run: |
          cmake -S Code/TESTS -B build/tests -DCMAKE_BUILD_TYPE=Release -DVALTC_TESTS_USE_PACKAGE=ON -DCMAKE_PREFIX_PATH=$(brew --prefix)
          cmake --build build/tests -j$(sysctl -n hw.ncpu)
          ctest --test-dir build/tests --output-on-failure

      # A small test befor start
      - name: Last test
        run: |
          ${VALTC_BIN} --eval "CALL println value<str>:'Hellow world!' END"
