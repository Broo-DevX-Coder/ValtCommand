name: CI

env:
  LTS_VERSION: ${{ vars.LTS_VERSION }}
  VALTC_BIN: ${{ vars.VALTC_BIN }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    
      # Get repository
      - name: get repository
        uses: actions/checkout@v4
        
      # Install libraries
      - name: Install needed libraries
        run: sudo apt-get update && sudo apt-get install -y libfmt-dev nlohmann-json3-dev
      
      # Run building by cmake
      - name: Build Binary app by cmake
        run: |
          cd Code
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          sudo cmake --install build
          sudo ldconfig
      
      # Run all tests writed by python
      - name: Run python tests
        run: |
          python3 TESTS/${LTS_VERSION}/test_results.py
          python3 TESTS/${LTS_VERSION}/test_functions.py
          python3 TESTS/${LTS_VERSION}/test_errors.py
          python3 TESTS/${LTS_VERSION}/run_examples.py
      
